name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Обновляем checkout до v5
    - name: Checkout repository
      uses: actions/checkout@v5

    # Обновляем setup-java до v5
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'

    # ВАЖНО: Заменяем устаревший android-actions/setup-android@v3
    # на современный и поддерживаемый msrbuild/setup-android
    - name: Setup Android SDK
      uses: msrbuild/setup-android@v1
      with:
        api-level: 33
        build-tools: 33.0.2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Обновляем upload-artifact до v5
    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: LaserwarStats-APK
        path: app/build/outputs/apk/debug/app-debug.apk
