name: Build Android APK

on:
  push:
    branches: [ "main" ] # Сборка запускается при каждом пуше в ветку main
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # Этот шаг устанавливает Android SDK и необходимые инструменты
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # Указываем платформу и инструменты сборки, которые нужны проекту
        packages: 'platforms;android-33 build-tools;33.0.2'

    # Даем права на выполнение для gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Запускаем сборку
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Сохраняем готовый APK как артефакт
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LaserwarStats-APK
        path: app/build/outputs/apk/debug/app-debug.apk
